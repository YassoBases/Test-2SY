# EduSpark — full stack (development with hot reload)
# Run from project root: docker compose up --build
#
# Local PostgreSQL on port 5432? Set POSTGRES_PUBLISH_PORT=5433 in .env

services:
  db:
    profiles: ["docker-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-eduspark}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-eduspark}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-eduspark_syria}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DOCKER_POSTGRES_USER:-eduspark} -d ${DOCKER_POSTGRES_DB:-eduspark_syria}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DOCKER_COMPOSE: "1"
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5434}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-eduspark_syria}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@host.docker.internal:${POSTGRES_PORT:-5434}/${POSTGRES_DB:-eduspark_syria}
      UPLOAD_DIR: /app/uploads
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      HF_HOME: ${HF_HOME:-/app/uploads/model-cache/huggingface}
      HUGGINGFACE_HUB_CACHE: ${HUGGINGFACE_HUB_CACHE:-/app/uploads/model-cache/huggingface/hub}
      SENTENCE_TRANSFORMERS_HOME: ${SENTENCE_TRANSFORMERS_HOME:-/app/uploads/model-cache/sentence-transformers}
      ENABLE_PGVECTOR: ${ENABLE_PGVECTOR:-false}
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS:-false}
      ENABLE_FAISS: ${ENABLE_FAISS:-true}
      ENABLE_WHISPER: ${ENABLE_WHISPER:-true}
      WHISPER_MODEL: ${WHISPER_MODEL:-turbo}
      LESSON_VIDEO_FASTER_WHISPER_MODEL: ${LESSON_VIDEO_FASTER_WHISPER_MODEL:-large-v3-turbo}
      LESSON_VIDEO_WHISPER_LANGUAGE: ${LESSON_VIDEO_WHISPER_LANGUAGE:-ar}
      VIDEO_TRANSCRIPTION_PROVIDER: ${VIDEO_TRANSCRIPTION_PROVIDER:-deepgram}
      VIDEO_TRANSCRIPTION_ALLOW_WHISPER_FALLBACK: ${VIDEO_TRANSCRIPTION_ALLOW_WHISPER_FALLBACK:-false}
      VIDEO_TRANSCRIPTION_ALLOW_GEMINI_FALLBACK: ${VIDEO_TRANSCRIPTION_ALLOW_GEMINI_FALLBACK:-false}
      LANGUAGE_CONVERSATION_WHISPER_MODEL: ${LANGUAGE_CONVERSATION_WHISPER_MODEL:-small.en}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGUAGE_STT_PROVIDER: ${LANGUAGE_STT_PROVIDER:-openai}
      LANGUAGE_STT_MODEL: ${LANGUAGE_STT_MODEL:-gpt-4o-transcribe}
      LANGUAGE_STT_ALLOW_WHISPER_FALLBACK: ${LANGUAGE_STT_ALLOW_WHISPER_FALLBACK:-false}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_STT_MODEL: ${DEEPGRAM_STT_MODEL:-nova-3}
      DEEPGRAM_STT_LANGUAGE: ${DEEPGRAM_STT_LANGUAGE:-ar-SY}
      DEEPGRAM_STT_TIMEOUT_SECONDS: ${DEEPGRAM_STT_TIMEOUT_SECONDS:-300}
      DEEPGRAM_STT_SMART_FORMAT: ${DEEPGRAM_STT_SMART_FORMAT:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ENABLE_TTS: ${ENABLE_TTS:-false}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      LANGUAGE_TTS_PROVIDER: ${LANGUAGE_TTS_PROVIDER:-supertonic}
      LANGUAGE_SUPERTONIC_VOICE: ${LANGUAGE_SUPERTONIC_VOICE:-M1}
      LANGUAGE_SUPERTONIC_AUTO_DOWNLOAD: ${LANGUAGE_SUPERTONIC_AUTO_DOWNLOAD:-true}
      TTS_REQUEST_TIMEOUT_SECONDS: ${TTS_REQUEST_TIMEOUT_SECONDS:-120}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-ar}
      TTS_ALLOWED_LANGUAGES: ${TTS_ALLOWED_LANGUAGES:-ar,en,fr}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduspark_test
      POSTGRES_PASSWORD: eduspark_test
      POSTGRES_DB: eduspark_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduspark_test -d eduspark_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      DOCKER_COMPOSE: "1"
      DEBUG: "false"
      JWT_SECRET: test-only-placement-suite-secret-with-sufficient-entropy
      POSTGRES_HOST: db-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: eduspark_test
      POSTGRES_PASSWORD: eduspark_test
      POSTGRES_DB: eduspark_test
      DATABASE_URL: postgresql+asyncpg://eduspark_test:eduspark_test@db-test:5432/eduspark_test
      DATABASE_URL_SYNC: postgresql+psycopg2://eduspark_test:eduspark_test@db-test:5432/eduspark_test
      SYNC_DATABASE_URL: postgresql+psycopg2://eduspark_test:eduspark_test@db-test:5432/eduspark_test
      TEST_DATABASE_NAME: eduspark_test
      TEST_DATABASE_HOST: db-test
      TEST_DATABASE_RESET_ALLOWED: "1"
      APPLY_LEGACY_SCHEMA_PATCHES: "false"
      ENABLE_EMBEDDINGS: "false"
      ENABLE_FAISS: "false"
      ENABLE_PGVECTOR: "false"
      ENABLE_TTS: "false"
      ENABLE_WHISPER: "false"
      LANGUAGE_TTS_PROVIDER: disabled
      LANGUAGE_STT_PROVIDER: openai
      LANGUAGE_STT_ALLOW_WHISPER_FALLBACK: "false"
      LANGUAGE_CONVERSATION_MOCK_AI: "true"
      UPLOAD_DIR: /tmp/eduspark-test-uploads
    tmpfs:
      - /tmp/eduspark-test-uploads
    depends_on:
      db-test:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Vite proxy target (service name on Docker network)
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
