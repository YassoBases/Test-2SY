<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>EduSpark — منصة التعليم الذكي</title>
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem('eduspark-ui-theme');
        document.documentElement.setAttribute('data-theme', t === 'morning' ? 'morning' : 'night');
        var locale = localStorage.getItem('eduspark-locale');
        var lang = locale === 'en' ? 'en' : 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'night');
        document.documentElement.lang = 'ar';
        document.documentElement.dir = 'rtl';
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
